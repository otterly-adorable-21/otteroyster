<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art Checklist · Otter &amp; Oyster</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b2f3a">
  <link rel="icon" href="assets/web/icon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --night: #071f26; --deep: #0c3440; --gold: #d9b45a; --gold-light: #f3d98c; --cream: #fbf4e2; --ink: #23343a; --muted: #6b7c80; --aqua: #3cc7c0; --ok: #2f9e44; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--cream); font: 15px/1.45 Nunito, system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
    h1, h2 { font-family: 'Cormorant Garamond', Georgia, serif; color: var(--gold-light); margin: 0; }
    h1 { font-size: 2.2rem; }
    h2 { font-size: 1.6rem; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    h2 small { font: 800 .85rem Nunito, sans-serif; color: var(--aqua); }
    a { color: var(--gold-light); }
    .lead { color: #cfe3e0; max-width: 70ch; }
    .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 10px 0 4px; max-width: 420px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--aqua), var(--gold)); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }
    .filters button { border: 1px solid rgba(217,180,90,.5); background: none; color: var(--cream); padding: 6px 12px; border-radius: 99px; font: 700 .85rem Nunito, sans-serif; cursor: pointer; }
    .filters button[aria-pressed=true] { background: var(--gold); color: var(--night); }
    section { margin-top: 30px; }
    .tip { color: #cfe3e0; margin: 6px 0 4px; max-width: 80ch; }
    .path { font: 600 .8rem ui-monospace, monospace; color: var(--aqua); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
    .slot { background: var(--cream); color: var(--ink); border-radius: 14px; padding: 10px; display: grid; gap: 4px; position: relative; box-shadow: inset 0 0 0 2px transparent; }
    .slot.done { box-shadow: inset 0 0 0 2px var(--ok); }
    .slot .pv { height: 96px; display: grid; place-items: center; background: #e9f3f0 repeating-conic-gradient(#e2ece9 0 25%, transparent 0 50%) 0 0 / 16px 16px; border-radius: 10px; overflow: hidden; font-size: 2.6rem; }
    .slot .pv img, .slot .pv svg { max-width: 100%; max-height: 96px; }
    .slot b { font-size: .88rem; line-height: 1.2; }
    .slot code { font-size: .78rem; color: #0c6e6a; word-break: break-all; }
    .slot small { color: var(--muted); font-size: .74rem; }
    .state { position: absolute; top: 6px; right: 8px; font-size: .9rem; }
    .swatch { width: 100%; height: 100%; }
    .hidden { display: none !important; }
    @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main>
    <h1>Art checklist</h1>
    <p class="lead">Every picture and animation you can replace. Upload a file to the folder shown, named exactly like the <b>code</b> under each card (plus <code>.png</code>, <code>.webp</code> or <code>.gif</code>). Green cards already have your art; the rest show what's drawn now. New uploads appear a minute or two after GitHub finishes.</p>
    <div id="summary"></div>
    <div class="filters" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">Everything</button>
      <button data-f="todo" aria-pressed="false">Still needed</button>
      <button data-f="done" aria-pressed="false">Done</button>
    </div>
    <div id="groups"></div>
  </main>
  <script type="module" src="js/art-page.js"></script>
</body>
</html>
