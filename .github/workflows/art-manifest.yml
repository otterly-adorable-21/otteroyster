# When art or animations are uploaded, rebuild assets/art/manifest.json (the list
# the website reads) and the README checklists, then commit them.
name: Update art list
on:
  push:
    paths:
      - 'assets/art/**'
      - 'assets/animations/**'
      - '!assets/art/manifest.json'
      - '!assets/art/**/README.md'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: art-manifest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/art-manifest.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "otter-art-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/art
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update art list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Commits made by this workflow don't always trigger a Pages rebuild, so ask for one.
      - name: Rebuild the website
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
